spring:
  application:
    name: discodeit

  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 10MB

discodeit:
  repository:
    type: file # jcf | file
    file-directory: .discodeit


springdoc:
  api-docs:
    path: /v3/api/docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha