spring:
  application:
    name: discodeit
  datasource:
    url: jdbc:postgresql://localhost:5434/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # ddl-auto=update: 엔티티에 맞춰 테이블을 자동 생성/보강(개발 편의). 운영(prod)에서는 validate 로 막는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 10MB

springdoc:
  api-docs:
    path: /v3/api/docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# prod 환경 false
decorator:
  datasource:
    enabled: true

logging:
  level:
    com.sprint.mission.discodeit: DEBUG

discodeit:
  storage:
    type: local
    local:
      root-path: ./uploads