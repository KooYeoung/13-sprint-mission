spring:
  application:
    # 애플리케이션 식별 이름
    name: discodeit

  profiles:
    # 별도 프로파일을 지정하지 않으면 개발 환경 적용
    default: dev

  jpa:
    # 컨트롤러 계층에서 지연 로딩이 발생하지 않도록 OSIV 비활성화
    open-in-view: false
    properties:
      hibernate:
        # 지연 로딩 시 배치 조회를 적용해 N+1 문제 완화
        default_batch_fetch_size: 100

  flyway:
    # 애플리케이션 실행 시 DB 마이그레이션 적용
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # 파일 업로드 크기 제한
      max-file-size: 10MB
      max-request-size: 20MB

springdoc:
  api-docs:
    # OpenAPI 명세 제공 경로
    path: /v3/api/docs

  swagger-ui:
    # Swagger UI 설정
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    # 기본 로그 레벨
    root: info

management:
  endpoints:
    web:
      exposure:
        # 외부에 노출할 Actuator 엔드포인트
        include:
          - health
          - info
          - metrics
          - loggers

  info:
    env:
      # info.* 설정을 /actuator/info 응답에 포함
      enabled: true

info:
  application:
    # Actuator에 표시할 애플리케이션 정보
    name: Discodeit
    version: 1.7.0

  datasource:
    url: ${spring.datasource.url}
    driver-class-name: ${spring.datasource.driver-class-name}

  jpa:
    ddl-auto: ${spring.jpa.hibernate.ddl-auto}

  storage:
    type: ${discodeit.storage.type}
    path: ${discodeit.storage.path}

  multipart:
    max-file-size: ${spring.servlet.multipart.max-file-size}
    max-request-size: ${spring.servlet.multipart.max-request-size}