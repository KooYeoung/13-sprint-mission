server:
  port: 8080

spring:
  docker:
    compose:
      # 애플리케이션 실행 시 Docker Compose 자동 실행
      enabled: true
      file: ./docker-compose.yml

      # 애플리케이션 종료 후에도 컨테이너 유지
      lifecycle-management: start-only

      readiness:
        # PostgreSQL 준비 완료 대기 설정
        timeout: 2m
        tcp:
          connect-timeout: 10s
          read-timeout: 5s

  datasource:
    # Docker PostgreSQL 연결 정보
    url: jdbc:postgresql://localhost:5434/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # DB 스키마는 Flyway가 관리하고 Hibernate는 검증만 수행
      ddl-auto: validate

  flyway:
    # 개발 환경 DB 마이그레이션 활성화
    enabled: true

decorator:
  datasource:
    # 개발 환경에서 P6Spy SQL 로그 활성화
    enabled: true

logging:
  level:
    # 프로젝트 및 SQL 상세 로그
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

discodeit:
  storage:
    # 개발 파일을 로컬 디렉터리에 저장
    type: local
    local:
      root-path: C:/codeit-13th-develop/13-sprint-mission/uploads